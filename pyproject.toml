[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetsim"
version = "0.1.0"
description = "Discrete-event simulation of an electric ride-hailing fleet"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fleetsim"]
