# Synthetic "large dense metro" scenario. All numbers are illustrative
# assumptions, NOT calibrated to any real city or operator.
city:
  name: dense_metro
  grid_size: 12              # 12 x 12 zones
  zone_km: 1.5               # ~18 km across
  detour_factor: 1.3
  daily_requests: 3000
  # relative demand by hour 00..23: night trough, AM peak ~08, PM peak ~17-19, evening tail
  hourly_share: [2.0, 1.4, 1.0, 0.8, 0.8, 1.2, 2.5, 4.5, 6.5, 5.0, 3.8, 3.8,
                 4.2, 4.2, 4.0, 4.4, 5.5, 6.8, 6.5, 5.2, 4.3, 3.8, 3.4, 2.8]
  # average traffic speed (km/h) by hour: free-flowing at night, congested in peaks
  speed_kmh_by_hour: [32, 33, 34, 34, 33, 30, 24, 18, 16, 19, 22, 22,
                      21, 21, 21, 20, 18, 16, 17, 20, 24, 27, 29, 31]
  base_weight: 0.15
  hotspots:
    - {x: 6,  y: 6, weight: 3.0, spread: 2.5}   # centre
    - {x: 3,  y: 8, weight: 1.5, spread: 1.0}   # major rail station
    - {x: 10, y: 2, weight: 1.0, spread: 0.8}   # airport / outer hub

fleet:
  n_vehicles: 100
  battery_kwh: 60
  kwh_per_km: 0.18
  charge_kw: 50
  low_soc: 0.20
  target_soc: 0.80
  reserve_soc: 0.08
  start_soc_min: 0.50
  start_soc_max: 0.95

charging_hubs:               # 4 hubs x 5 points = 20 charge points
  - {x: 5, y: 5, points: 5}
  - {x: 2, y: 9, points: 5}
  - {x: 9, y: 3, points: 5}
  - {x: 8, y: 9, points: 5}

pricing:
  base_fare: 2.50
  per_km: 1.25
  per_min: 0.25
  energy_cost_per_kwh: 0.35

ops:
  duration_hours: 24
  dispatch_interval_min: 0.5
  max_wait_min: 10
  max_pickup_min: 15
  policy: greedy
